// ═══════════════════════════════════════════════════════════════════
//  PHYSICAL CONSTANTS
// ═══════════════════════════════════════════════════════════════════
const e_C = 1.60218e-19;
const k_B = 1.38065e-23;
const eps0 = 8.85419e-12;
const NA = 6.02214e23;
    

// ═══════════════════════════════════════════════════════════════════
//  ELECTROCHEMISTRY
// ═══════════════════════════════════════════════════════════════════
function muElectrolyte(pH) {
  return -5.055 + 0.059 * pH;
}
function phiTotal(pH, WF_eV) {
  return -WF_eV - muElectrolyte(pH);
}
function flatbandVoltage(pH, WF_eV) {
  return 4.44 - WF_eV;
}

// ═══════════════════════════════════════════════════════════════════
//  BRENT ROOT-FINDER
// ═══════════════════════════════════════════════════════════════════
function brentq(f, a, b, tol = 1e-12, maxIter = 200) {
  let fa = f(a),
    fb = f(b);
  if (fa * fb > 0) return (a + b) / 2;
  if (Math.abs(fa) < Math.abs(fb)) {
    [a, b] = [b, a];
    [fa, fb] = [fb, fa];
  }
  let c = a,
    fc = fa,
    d = a,
    mflag = true,
    s;
  for (let i = 0; i < maxIter; i++) {
    if (Math.abs(b - a) < tol) break;
    if (fa !== fc && fb !== fc) {
      s = a * fb * fc / ((fa - fb) * (fa - fc)) + b * fa * fc / ((fb - fa) * (fb - fc)) + c * fa * fb / ((fc - fa) * (fc - fb));
    } else {
      s = b - fb * (b - a) / (fb - fa);
    }
    const cond1 = (s - (3 * a + b) / 4) * (s - b) > 0;
    const cond2 = mflag && Math.abs(s - b) >= Math.abs(b - c) / 2;
    const cond3 = !mflag && Math.abs(s - b) >= Math.abs(c - d) / 2;
    const cond4 = mflag && Math.abs(b - c) < tol;
    const cond5 = !mflag && Math.abs(c - d) < tol;
    if (cond1 || cond2 || cond3 || cond4 || cond5) {
      s = (a + b) / 2;
      mflag = true;
    } else {
      mflag = false;
    }
    const fs = f(s);
    d = c;
    c = b;
    fc = fb;
    if (fa * fs < 0) {
      b = s;
      fb = fs;
    } else {
      a = s;
      fa = fs;
    }
    if (Math.abs(fa) < Math.abs(fb)) {
      [a, b] = [b, a];
      [fa, fb] = [fb, fa];
    }
  }
  return b;
}

// ═══════════════════════════════════════════════════════════════════
//  SEMICONDUCTOR PHYSICS  (Gouy-Chapman + Mott-Schottky)
// ═══════════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════
//  SURFACE TRAPPED CHARGE (surface states)
//  Discrete trap level at E_t above the surface VBM.
//  Band convention (see getBandProfile_SC):
//    E_F = −WF (flat);  E_vac(x) = Φ_total − φ(x);  E_VBM = E_vac − χ − Eg
//    ξ_bulk = E_F − E_VBM(bulk) = −WF + χ + Eg
//    ξ_surf = ξ_bulk − φ_s          (band bending raises/lowers surface VBM)
//  Occupancy (Fermi-Dirac):  f = 1 / (1 + exp((E_t − ξ_surf)/kT))
//  Charge:
//    acceptor-like: neutral empty, −e when filled  →  Q_ss = −e·N·f
//    donor-like:    +e when empty, neutral filled  →  Q_ss = +e·N·(1−f)
//  Because Q_ss depends on φ_s, it enters the balance self-consistently
//  and reproduces Fermi-level pinning at large N.
// ═══════════════════════════════════════════════════════════════════
function surfaceTrapCharge(phi_s, traps, T) {
  if (!traps || !(traps.N_m2 > 0)) return 0;
  const kT = k_B * T / e_C; // eV
  const xi_surf = traps.xi_bulk_eV - phi_s; // E_F − E_VBM at surface [eV]
  const dE = (traps.E_t_eV - xi_surf) / kT;
  const f = 1 / (1 + Math.exp(Math.max(-200, Math.min(200, dE))));
  return traps.type === "donor" ? e_C * traps.N_m2 * (1 - f) : -e_C * traps.N_m2 * f;
}
function findVH_SC(NA_m3, c0_m3, Phi_total, eps_s, eps_f, T, sigma_surf = 0, traps = null) {
  const lo = Math.max(-Math.abs(Phi_total) + 1e-6, -0.9999);
  const hi = Math.min(Math.abs(Phi_total) - 1e-6, 0.9999);
  if (lo >= hi) return 0;
  const balance = Vh => {
    const phi_s = Phi_total - Vh;
    const Q_solid = Math.sign(phi_s) * Math.sqrt(2 * e_C * NA_m3 * eps_s * Math.abs(phi_s));
    const Q_liquid = -Math.sqrt(8 * eps_f * k_B * T * c0_m3) * Math.sinh(e_C * Vh / (2 * k_B * T));
    const Q_ss = surfaceTrapCharge(phi_s, traps, T);
    return Q_solid + Q_liquid + sigma_surf + Q_ss;
  };
  return brentq(balance, lo, hi);
}
function getProfile_SC(V_H, NA_m3, c0_m3, Phi_total, eps_s, eps_f, T, N_pts = 400) {
  const kappa = Math.sqrt(2 * e_C * e_C * c0_m3 / (eps_f * k_B * T));
  const lambda_D = 1 / kappa; // Debye length [m]
  const phi_s = Phi_total - V_H;
  const W = Math.sqrt(2 * eps_s * Math.abs(phi_s) / (e_C * NA_m3));
  const gamma = Math.tanh(e_C * V_H / (4 * k_B * T));

  // Liquid side: show exactly 2 Debye lengths
  const liqSpan = Math.max(2 * lambda_D, 0.5e-9);
  // Solid side: show 1.5×W beyond interface (min 2 nm), rounded up to 0.5 nm
  const solSpanRaw = Math.max(1.5 * W, 2e-9);
  const solSpan = Math.ceil(solSpanRaw * 2e9) / 2e9; // round up to 0.5 nm

  const liqPts = [],
    solPts = [];
  for (let i = 0; i < N_pts; i++) {
    const x = -liqSpan * (1 - i / (N_pts - 1));
    const arg = gamma * Math.exp(kappa * x);
    const phi = arg >= 1 || arg <= -1 ? Math.sign(arg) * 4 * k_B * T / e_C * 15 : 4 * k_B * T / e_C * Math.atanh(arg);
    liqPts.push({
      x: x * 1e9,
      phi: phi * 1000
    });
  }
  // Generate solid points all the way to solSpan so the curve reaches xMax
  for (let i = 0; i < N_pts; i++) {
    const x = solSpan * i / (N_pts - 1);
    const phi = x <= W ? (Phi_total - phi_s * ((W - x) / W) ** 2) * 1000 : Phi_total * 1000;
    solPts.push({
      x: x * 1e9,
      phi
    });
  }
  return {
    liq: liqPts,
    sol: solPts,
    W_nm: W * 1e9,
    V_H_mV: V_H * 1000,
    phi_s_mV: phi_s * 1000,
    xMin_nm: -liqSpan * 1e9,
    xMax_nm: solSpan * 1e9,
    lambda_D_nm: lambda_D * 1e9
  };
}

// ═══════════════════════════════════════════════════════════════════
//  METAL PHYSICS  (all drop at Helmholtz + diffuse layer, flat bulk)
//
//  For a metal the electrode has no space-charge region. The system
//  is fully determined by Φ_total = phiTotal(pH, WF):
//    • φ(x > 0) = Φ_total  (perfect conductor, flat everywhere)
//    • The Gouy-Chapman diffuse layer carries exactly Q_diffuse = −Q_metal
//    • V_H = Φ_total  (entire potential drops in solution)
//    • σ_surf is NOT a free parameter — it is set by the thermodynamics
//      of the equilibrium: Q_metal = −Q_diffuse(Φ_total)
//  The only free inputs are pH, Φ_WF (→ Φ_total), c₀, and T.
// ═══════════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════
//  METAL — GOUY-CHAPMAN with AUTO-STERN
//  Saturation criterion: GC surface concentration > 3D close-packing
//    c_surf = c₀·exp(|eΦ/kT|)  vs  n_max_3D = 1/(4√2·r_solv³)
//  When saturated:
//    σ_Stern = −sign(Φ)·n_max_2D·e   [n_max_2D = 1/(2√3·r_solv²)]
//    Stern plane at x = −r_solv (OHP)
//    Solve: V_diff + (σ_Stern + Q₀·sinh(eV_diff/2kT))/C_H = Φ_total
//    C_H = ε_H·ε₀ / r_solv
// ═══════════════════════════════════════════════════════════════════
function getProfile_Metal(c0_m3, Phi_total, eps_f, T, r_solv_nm, eps_H, N_pts = 400) {
  const kappa = Math.sqrt(2 * e_C * e_C * c0_m3 / (eps_f * k_B * T));
  const lambda_D = 1 / kappa;
  const Q0 = Math.sqrt(8 * eps_f * k_B * T * c0_m3);
  const liqSpan = Math.max(2 * lambda_D, 0.5e-9);
  const r_m = r_solv_nm * 1e-9;

  // ── Saturation check ─────────────────────────────────────────────
  // Surface concentration of counter-ions at GC OHP (pure GC, V_H = Phi_total)
  const c_surf_GC = c0_m3 * Math.exp(Math.min(50, Math.abs(e_C * Phi_total / (k_B * T))));
  const n_max_3D = 1 / (4 * Math.sqrt(2) * r_m * r_m * r_m); // HCP packing [m⁻³]
  const autoStern = c_surf_GC > n_max_3D;
  let V_diff, V_stern_v;
  const C_H = eps_H * eps0 / r_m; // F/m²

  if (autoStern) {
    // Standard GCS: V_diff + Q_GC(V_diff)/C_H = Phi_total (no fixed σ_Stern)
    // d = r_solv sets the capacitance; surface concentration is limited naturally.
    const f = Vd => Vd + Q0 * Math.sinh(Math.max(-200, Math.min(200, e_C * Vd / (2 * k_B * T)))) / C_H - Phi_total;
    V_diff = Math.abs(Phi_total) < 1e-6 ? 0 : brentq(f, -Math.abs(Phi_total) * 3 - 1, Math.abs(Phi_total) * 3 + 1);
    V_stern_v = Phi_total - V_diff;
  } else {
    V_diff = Phi_total;
    V_stern_v = 0;
  }
  const gamma = Math.tanh(e_C * V_diff / (4 * k_B * T));
  const Q_metal = Q0 * Math.sinh(Math.max(-200, Math.min(200, e_C * V_diff / (2 * k_B * T))));
  const liqPts = [];
  const N_diff = autoStern ? Math.round(N_pts * 0.85) : N_pts;
  for (let i = 0; i < N_diff; i++) {
    const x_gc = -liqSpan * (1 - i / (N_diff - 1));
    const x = x_gc - (autoStern ? r_m : 0);
    const arg = gamma * Math.exp(kappa * x_gc);
    const phi = arg >= 1 || arg <= -1 ? Math.sign(arg) * 4 * k_B * T / e_C * 15 : 4 * k_B * T / e_C * Math.atanh(arg);
    liqPts.push({
      x: x * 1e9,
      phi: phi * 1000
    });
  }
  if (autoStern) {
    // Stern region: linear from V_diff (at OHP = x=−r_solv) to Phi_total (at IHP = x=0)
    for (let i = 0; i <= 20; i++) {
      const t = i / 20;
      liqPts.push({
        x: (-r_m + r_m * t) * 1e9,
        phi: (V_diff + V_stern_v * t) * 1000
      });
    }
  }
  const solPts = [];
  for (let i = 0; i <= 20; i++) solPts.push({
    x: 2e-9 * i / 20 * 1e9,
    phi: Phi_total * 1000
  });
  return {
    liq: liqPts,
    sol: solPts,
    W_nm: 0,
    V_H_mV: autoStern ? V_stern_v * 1000 : Phi_total * 1000,
    V_diff_mV: autoStern ? V_diff * 1000 : null,
    phi_s_mV: 0,
    Q_metal_Cm2: Q_metal,
    xMin_nm: -(liqSpan + (autoStern ? r_m : 0)) * 1e9,
    xMax_nm: 2,
    lambda_D_nm: lambda_D * 1e9,
    d_nm: autoStern ? r_solv_nm : 0,
    autoStern,
    C_H_uFcm2: autoStern ? C_H * 1e-4 * 1e6 : null
  };
}

// ─── Dynamic charge formatter: C/m² → auto-range to μC/cm², mC/m², etc.
function fmtCharge(Q_Cm2) {
  // Convert to μC/cm²: 1 C/m² = 100 μC/cm²
  const uCcm2 = Q_Cm2 * 100 * 1e6; // = Q_Cm2 * 1e8 μC/cm²
  // Actually: 1 C/m² = 1e4 μC/m² = 100 μC/cm²... let's be careful:
  // 1 C/m² × (1 m² / 1e4 cm²) = 1e-4 C/cm² = 100 μC/cm²  ✓
  const val_uCcm2 = Q_Cm2 * 1e2; // μC/cm²  (1 C/m² = 100 μC/cm²)
  const abs = Math.abs(val_uCcm2);
  if (abs === 0) return {
    val: "0",
    unit: "μC/cm²"
  };
  if (abs >= 1e3) return {
    val: (val_uCcm2 / 1e3).toFixed(3),
    unit: "mC/cm²"
  };
  if (abs >= 1) return {
    val: val_uCcm2.toFixed(3),
    unit: "μC/cm²"
  };
  if (abs >= 1e-3) return {
    val: (val_uCcm2 * 1e3).toFixed(3),
    unit: "nC/cm²"
  };
  return {
    val: (val_uCcm2 * 1e6).toFixed(3),
    unit: "pC/cm²"
  };
}

// ═══════════════════════════════════════════════════════════════════
function getBandProfile_SC(curve, chi_eV, Eg_eV, WF_eV, N_pts = 300) {
  if (!curve) return null;
  const ef = -WF_eV;
  const vacAt = phi_mV => curve.phiTotal - phi_mV / 1000;
  const stride = Math.max(1, Math.ceil(curve.sol.length / N_pts));
  const solPts = curve.sol.filter((_, i) => i % stride === 0).map(p => {
    const vac = vacAt(p.phi);
    return {
      x: p.x,
      vac,
      cbm: vac - chi_eV,
      vbm: vac - chi_eV - Eg_eV
    };
  });
  const liqPts = curve.liq.filter((_, i) => i % stride === 0).map(p => ({
    x: p.x,
    vac: vacAt(p.phi)
  }));
  const vacLiqBulk = curve.phiTotal;
  const toSHE = E_eV => vacLiqBulk - E_eV - 4.44;
  return {
    solPts,
    liqPts,
    ef,
    toSHE
  };
}

// ═══════════════════════════════════════════════════════════════════
//  METAL BAND DIAGRAM PHYSICS
//  Metal: flat E_F = −WF everywhere in solid.
//  E_vac(solid) = 0 (our convention: vacuum of bulk metal = reference).
//  The metal is a perfect conductor → φ(x>0) = Φ_total → E_vac(x>0) shifts uniformly.
//  We show E_F as a flat line, E_vac slightly above it (= WF), and hatching for the bulk.
// ═══════════════════════════════════════════════════════════════════
function getBandProfile_Metal(curve, WF_eV, N_pts = 300) {
  if (!curve) return null;
  const ef = -WF_eV;
  const vacAt = phi_mV => curve.phiTotal - phi_mV / 1000;
  const stride = Math.max(1, Math.ceil(curve.liq.length / N_pts));
  // Metal solid side: E_vac is flat at (Φ_total − Φ_total) = 0
  // Actually E_vac(x>0) = curve.phiTotal − φ(x>0) = 0 since φ = Φ_total everywhere
  const solPts = curve.sol.filter((_, i) => i % stride === 0).map(p => {
    const vac = vacAt(p.phi); // = 0 since p.phi = Φ_total*1000
    return {
      x: p.x,
      vac
    };
  });
  const liqPts = curve.liq.filter((_, i) => i % stride === 0).map(p => ({
    x: p.x,
    vac: vacAt(p.phi)
  }));
  const vacLiqBulk = curve.phiTotal;
  const toSHE = E_eV => vacLiqBulk - E_eV - 4.44;
  return {
    solPts,
    liqPts,
    ef,
    toSHE
  };
}

// ═══════════════════════════════════════════════════════════════════
//  CHARGE DENSITY STRIP
// ═══════════════════════════════════════════════════════════════════
function ChargeStrip({
  curves,
  xMin_nm,
  xMax_nm,
  width,
  dark,
  isMetal,
  padL,
  padR,
  c0_M,
  NA_cm3,
  Temp,
  sigmaRaw,
  rIon_A,
  rSolv_A
}) {
  const STRIP_H = 70;
  const plotW = width - padL - padR;
  const N_COLS = Math.max(80, Math.floor(plotW));
  const kT_eV = k_B * Temp / e_C;
  const c0_m3 = c0_M * 1e3 * NA;
  const NA_m3 = NA_cm3 * 1e6;
  if (!curves.length) return null;
  const curve = curves[0];
  const xSpan = xMax_nm - xMin_nm;
  const ifFrac = -xMin_nm / xSpan;
  const ifX = padL + ifFrac * plotW;

  // φ interpolator
  const allPts = [...curve.liq, ...curve.sol].sort((a, b) => a.x - b.x);
  const interpPhi = x_nm => {
    let lo = 0,
      hi = allPts.length - 1;
    while (lo < hi - 1) {
      const mid = lo + hi >> 1;
      allPts[mid].x <= x_nm ? lo = mid : hi = mid;
    }
    const p0 = allPts[lo],
      p1 = allPts[hi];
    if (p0 === p1 || p1.x === p0.x) return p0.phi / 1000;
    return (p0.phi + (x_nm - p0.x) / (p1.x - p0.x) * (p1.phi - p0.phi)) / 1000;
  };

  // ρ columns
  const phiSsgn = curve.phi_s_mV !== undefined ? Math.sign(curve.phi_s_mV) : -1;
  const liqCols = [],
    solCols = [];
  for (let ci = 0; ci < N_COLS; ci++) {
    const x_nm = xMin_nm + xSpan * ci / (N_COLS - 1);
    const phi_V = interpPhi(x_nm);
    if (x_nm <= 0) {
      const sh = Math.sinh(Math.max(-20, Math.min(20, phi_V / kT_eV)));
      liqCols.push({
        ci,
        x_nm,
        rho: -2 * c0_m3 * sh
      });
    } else {
      const inSCR = !isMetal && curve.W_nm > 0 && x_nm < curve.W_nm;
      solCols.push({
        ci,
        x_nm,
        rho: inSCR ? phiSsgn * NA_m3 : 0
      });
    }
  }

  // Background gradient (independent normalisation per side)
  const liqMax = Math.max(1e-10, ...liqCols.map(c => Math.abs(c.rho)));
  const solMax = isMetal ? 1 : Math.max(1e-10, ...solCols.map(c => Math.abs(c.rho)));
  const normL = r => Math.max(-1, Math.min(1, r / liqMax));
  const normS = r => Math.max(-1, Math.min(1, r / solMax));
  const colMap = n => {
    const a = 0.06 + 0.70 * Math.abs(n);
    if (n > 0) return "rgba(210,60,50," + a.toFixed(2) + ")";
    if (n < 0) return "rgba(40,80,210," + a.toFixed(2) + ")";
    return "rgba(120,120,120,0.04)";
  };

    u: "G" + unit

    u: "M" + unit
